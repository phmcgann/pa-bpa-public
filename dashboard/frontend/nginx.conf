server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Tech support file uploads can run well over 100MB — nginx's 1MB default
    # would otherwise reject them with 413 before they ever reach the backend.
    client_max_body_size 300M;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://backend:8000;
    }

    location / {
        try_files $uri /index.html;
    }
}
